name: Reviewed Neon schema migration

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Full 40-character main commit SHA whose migrations you reviewed
        required: true
        type: string
      confirmation:
        description: Confirm review of the schema change and target database
        required: true
        type: choice
        options: [do-not-run, reviewed-upgrade-head]

permissions:
  contents: read

concurrency:
  group: somas-neon-schema-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'lotsmanroman781-gif/somas' &&
      vars.SOMAS_MIGRATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify explicit review before accessing database credentials
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = reviewed-upgrade-head
          test "$REVIEWED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reviewed dependencies (no database secret in this step)
        run: python -m pip install -r requirements.txt
      - name: Upgrade reviewed schema only
        env:
          DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          from alembic import command
          from alembic.config import Config
          if not os.environ.get('DATABASE_URL'):
              sys.exit('Protected migration secret is not configured; no migration executed.')
          try:
              command.upgrade(Config('alembic.ini'), 'head')
          except Exception:
              sys.exit('Migration failed. Review database access and the schema offline; credentials are not printed.')
          print('Reviewed schema upgrade completed.')
          PY
