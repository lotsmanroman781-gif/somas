name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: somas
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U somas -d postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Static checks
        run: |
          python -m ruff check app tests scripts migrations --select F,E9
          python -m ruff format --check app tests scripts migrations
      - name: PostgreSQL migrations, API, restart persistence and live proxy tests
        env:
          SOMAS_TEST_DATABASE_URL: postgresql://somas:test-only-password@127.0.0.1:5432/postgres
          SOMAS_TEST_PAGES_RUNTIME: '1'
        run: python -m pytest -q
      - name: Proxy contract tests
        run: npm test
      - name: Compile Pages Functions
        run: npx wrangler pages functions build functions --outdir /tmp/somas-pages-build
      - name: Native Python runtime bundle preflight (no cloud or database credentials)
        run: |
          python -m pip install -r requirements.txt --target .vercel-check/vendor
          python scripts/check_vercel_bundle.py
